name: Build package

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install package + dev tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . pytest ruff

    - name: Lint (ruff)
      run: |
        # Check for Python syntax errors or undefined names
        python -m ruff check . --select=E9,F63,F7,F82 --output-format=github
        # Run full linting with the configured rules (warnings only)
        python -m ruff check . --output-format=github

    - name: Run tests
      run: python -m pytest

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/chmpy/
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: write   # GitHub release upload

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build sdist and universal wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
