[project]
name = "chmpy"
readme = "README.md"
version = "1.3.0"
requires-python = ">=3.10"
description = "Molecules, crystals, promolecule and Hirshfeld surfaces using python."
authors = [
    { name = "Peter Spackman", email = "peterspackman@fastmail.com"},
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
keywords = [
    "chemistry",
    "crystallography",
    "molecular-modeling",
    "hirshfeld-surface",
    "promolecule-density",
    "shape-descriptors",
    "spherical-harmonics",
    "cif",
    "fhi-aims",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.1.2",
    "scipy>=1.14.1",
    "Jinja2>=3.1.2",
    "pillow>=8",
]

[project.optional-dependencies]
# plotting and mesh handling are a small part of what chmpy does but most of
# its install weight, so they are extras; chmpy.util.optional turns a missing
# one into a message naming the extra to install
plots = [
    "matplotlib>=3.9.2",
]
mesh = [
    "trimesh>=4.5.0",
]
ase = [
    "ase>=3.22",
]
# everything, for anyone who had the pre-split behaviour
all = [
    "chmpy[plots,mesh,ase]",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
chmpy-view = "chmpy.tui.__main__:main"
chmpy-convert = "chmpy.cmd.convert:main"

[project.urls]
homepage = "https://github.com/peterspackman/chmpy"
repository = "https://github.com/peterspackman/chmpy"
documentation = "https://peterspackman.github.io/chmpy/"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E741"]
